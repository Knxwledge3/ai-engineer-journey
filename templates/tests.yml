# Положи этот файл в .github/workflows/tests.yml своего репозитория (День 19).
# Перед использованием сверь версии actions с документацией GitHub.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
